services:
  - type: web
    name: finance-platform-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finance-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://finance-platform-web.onrender.com"]'
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_ENABLED
        value: "false"
      - key: AI_PRIVACY_MODE
        value: "true"

  - type: web
    name: finance-platform-web
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: ./web
    dockerfilePath: ./web/Dockerfile
    autoDeploy: false
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://finance-platform-api.onrender.com

databases:
  - name: finance-platform-db
    databaseName: finance_db
    user: finance_user
    plan: basic-256mb
    region: oregon
    ipAllowList: []
